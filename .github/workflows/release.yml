name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          VERSION="${{ github.event.inputs.version_name || github.ref_name }}"
          if [ "$VERSION" = "main" ] || [ -z "$VERSION" ]; then
            DETECTED_VER=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | tr -d '[:space:]')
            VERSION="v${DETECTED_VER}"
          fi
          APK_DIR="app/build/outputs/apk/release"
          APK_NAME="MobCare-${VERSION}.apk"
          
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$APK_NAME"
          elif [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
            cp "$APK_DIR/app-release-unsigned.apk" "$APK_NAME"
          fi
          
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobCare-Release-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version }}
          name: "MobCare ${{ steps.prepare_apk.outputs.version }} Release"
          draft: false
          prerelease: false
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          body: |
            ### 🛡️ MobCare System Telemetry & Device Protection Sentinel (${{ steps.prepare_apk.outputs.version }})

            Official signed release APK built automatically via GitHub Actions CI/CD.

            #### 📦 What's New in v2.0.0:
            - **Unified 4-Tab Bottom Navigation:** Seamless zero-flicker switching between Home, Activity, Protection, and Settings.
            - **Dedicated Settings & Permissions Hub:** Complete separation of system permissions from stealth settings, with 1-tap live status toggles for Accessibility, Device Admin, Battery Exemption, Overlay, and Usage Access.
            - **Tactical App Locker & Fake Crash Mode:** Instant realistic Android system crash simulation ("*`<AppName>` keeps stopping*") with exit to home screen.
            - **Decoy Panic PIN System:** Decoy PIN triggers simulated crash while silently capturing intruder camera selfies and security audit telemetry.
            - **Secret Owner Bypass:** Long-press on "Close app" or triple-tap the error title to instantly reveal the genuine PIN gate.
            - **40-Layer Security Defense Matrix:** Core, Advanced & Hardware honeypot layers with complete offline security.
            - **Consistent Edge-to-Edge Top App Bars:** Removed child back buttons from top-level destinations with fitted, uniform styling.

            #### 📲 Installation Instructions:
            1. Download the `MobCare-${{ steps.prepare_apk.outputs.version }}.apk` below.
            2. Tap the downloaded file to install on your Android device (Android 8.0+ / API 26+).
            3. Grant necessary permissions (Accessibility Sentinel, Overlay, Usage Access) to activate all features.